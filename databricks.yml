bundle:
  name: healthcare-claim-ops
  engine: direct

sync:
  exclude:
    - docs/**
    - tests/**
    - .git/**
    - __pycache__/**
    - "*.pyc"
    # - "*.dist-info"
    # - "*.dist-info/**"
    # - .pytest_cache/**
    # - .venv/**
    # - build/**
    # - .databricks/**

include:
  - resources/schemas/schemas.yml
  - resources/volumes/volumes.yml
  - services/*/resources/*.yml
  - services/*/*/resources/*.yml
  - services/*/*/*/resources/*.yml

variables:
  catalog:
    default: healthcare
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  analytics_schema:
    default: analytics
  ml_schema:
    default: ml
  node_type_id:
    default: n2-highmem-2
  spark_version:
    default: 17.3.x-cpu-ml-scala2.13
  model_version:
    description: MLflow registered model version for production serving.
  vector_search_endpoint_name:
    default: healthcare_policy_vector_endpoint
  vector_search_index_name:
    default: healthcare.gold.policy_chunks_index
  vector_search_query_model_endpoint_name:
    default: databricks-gte-large-en
  claim_analysis_model_name:
    description: Registered model name for claim-analysis serving endpoint.
    default: healthcare.ml.claim_denial_analysis
  claim_analysis_model_alias:
    description: Alias for the claim-analysis model version.
    default: champion
  claim_analysis_endpoint_name:
    description: Databricks serving endpoint name for claim analysis.
    default: claim-denial-analysis
  raw_landing_storage_location:
    description: External GCS prefix backing healthcare.bronze.raw_landing.
    default: gs://homeprojectabacus-etl-landing-monthhome/claimops-raw-landing/

experimental:
  skip_name_prefix_for_schema: true

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: dev
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: healthcare
      model_version: "1"
      vector_search_endpoint_name: healthcare_policy_vector_endpoint
      vector_search_index_name: healthcare.gold.policy_chunks_index
      vector_search_query_model_endpoint_name: databricks-gte-large-en
      claim_analysis_model_name: healthcare.ml.claim_denial_analysis
      claim_analysis_model_alias: champion
      claim_analysis_endpoint_name: claim-denial-analysis
      raw_landing_storage_location: gs://homeprojectabacus-etl-landing-monthhome/claimops-raw-landing/
  prod:
    mode: production
    workspace:
      profile: prod
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: healthcare
      vector_search_endpoint_name: healthcare_policy_vector_endpoint
      vector_search_index_name: healthcare.gold.policy_chunks_index
      vector_search_query_model_endpoint_name: databricks-gte-large-en
      raw_landing_storage_location: gs://homeprojectabacus-etl-landing-monthhome/claimops-raw-landing/
