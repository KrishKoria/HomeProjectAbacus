bundle:
  name: healthcare-claim-ops
  engine: direct

sync:
  exclude:
    - docs/**
    - tests/**
    - .git/**
    - __pycache__/**
    - "*.pyc"
    - "*.dist-info"
    - "*.dist-info/**"
    - .pytest_cache/**
    - .venv/**
    - dist/**
    - build/**
    - .databricks/**

include:
  - resources/schemas/schemas.yml
  - resources/volumes/volumes.yml
  - services/*/resources/*.yml
  - services/*/*/resources/*.yml
  - services/*/*/*/resources/*.yml

variables:
  catalog:
    default: healthcare
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  analytics_schema:
    default: analytics
  ml_schema:
    default: ml
  node_type_id:
    default: n2-highmem-2
  spark_version:
    default: 17.3.x-cpu-ml-scala2.13
  model_version:
    description: MLflow registered model version for production serving.
  vector_search_endpoint_name:
    default: healthcare_policy_vector_endpoint
  vector_search_index_name:
    default: healthcare.gold.policy_chunks_index
  vector_search_query_model_endpoint_name:
    default: databricks-gte-large-en
  app_sql_warehouse_id:
    description: SQL warehouse ID used by the Databricks frontend app.
    default: "26e842cddb906c23"
  app_sql_http_path:
    description: SQL warehouse HTTP path used by the Databricks frontend app.
    default: /sql/1.0/warehouses/26e842cddb906c23
  app_claim_features_table:
    default: healthcare.gold.claim_features
  app_model_registry_name:
    default: healthcare.ml.claim_denial_model
  app_model_alias:
    default: champion

experimental:
  skip_name_prefix_for_schema: true

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: dev
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: healthcare
      model_version: "1"
      vector_search_endpoint_name: healthcare_policy_vector_endpoint
      vector_search_index_name: healthcare.gold.policy_chunks_index
      vector_search_query_model_endpoint_name: databricks-gte-large-en
      app_claim_features_table: healthcare.gold.claim_features
      app_model_registry_name: healthcare.ml.claim_denial_model
      app_model_alias: champion
  prod:
    mode: production
    workspace:
      profile: prod
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: healthcare
      vector_search_endpoint_name: healthcare_policy_vector_endpoint
      vector_search_index_name: healthcare.gold.policy_chunks_index
      vector_search_query_model_endpoint_name: databricks-gte-large-en
      app_claim_features_table: healthcare.gold.claim_features
      app_model_registry_name: healthcare.ml.claim_denial_model
      app_model_alias: champion
