bundle:
  name: healthcare-claim-ops
  engine: direct

include:
  - resources/schemas/schemas.yml
  - resources/volumes/volumes.yml
  - services/*/resources/*.yml
  - services/*/*/resources/*.yml
  - services/*/*/*/resources/*.yml

variables:
  catalog:
    default: healthcare
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  analytics_schema:
    default: analytics
  ml_schema:
    default: ml
  node_type_id:
    default: n2-highmem-2
  spark_version:
    default: 17.3.x-cpu-ml-scala2.13
  model_version:
    description: MLflow registered model version for production serving.

experimental:
  skip_name_prefix_for_schema: true

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: dev
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: healthcare
      model_version: "1"
  prod:
    mode: production
    workspace:
      profile: prod
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: healthcare
    resources:
      pipelines:
        bronze_pipeline:
          serverless: false
          photon: false
          configuration:
            pipelines.clusterShutdown.delay: "0s"
          clusters:
            - label: default
              node_type_id: ${var.node_type_id}
              driver_node_type_id: ${var.node_type_id}
              num_workers: 0
              gcp_attributes:
                availability: ON_DEMAND_GCP
                local_ssd_count: 1
                zone_id: AUTO
              spark_conf:
                spark.databricks.cluster.profile: singleNode
                spark.master: local[*]
              custom_tags:
                ResourceClass: SingleNode
                Project: homeprojectabacus
                Environment: ${bundle.target}
        silver_pipeline:
          serverless: false
          photon: false
          configuration:
            pipelines.clusterShutdown.delay: "0s"
          clusters:
            - label: default
              node_type_id: ${var.node_type_id}
              driver_node_type_id: ${var.node_type_id}
              num_workers: 0
              gcp_attributes:
                availability: ON_DEMAND_GCP
                local_ssd_count: 1
                zone_id: AUTO
              spark_conf:
                spark.databricks.cluster.profile: singleNode
                spark.master: local[*]
              custom_tags:
                ResourceClass: SingleNode
                Project: homeprojectabacus
                Environment: ${bundle.target}
        gold_pipeline:
          serverless: false
          photon: false
          configuration:
            pipelines.clusterShutdown.delay: "0s"
          clusters:
            - label: default
              node_type_id: ${var.node_type_id}
              driver_node_type_id: ${var.node_type_id}
              num_workers: 0
              gcp_attributes:
                availability: ON_DEMAND_GCP
                local_ssd_count: 1
                zone_id: AUTO
              spark_conf:
                spark.databricks.cluster.profile: singleNode
                spark.master: local[*]
              custom_tags:
                ResourceClass: SingleNode
                Project: homeprojectabacus
                Environment: ${bundle.target}
