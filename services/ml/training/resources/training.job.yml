resources:
  jobs:
    ml_retrain_job:
      name: "[${bundle.target}] Healthcare ML Retrain"

      tasks:
        - task_key: maybe_retrain_model
          spark_python_task:
            python_file: ../../../../src/scripts/maybe_retrain_model.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --gold-table
              - ${var.catalog}.${var.gold_schema}.claim_features
              - --registered-model-name
              - ${var.catalog}.${var.ml_schema}.claim_denial_model
              - --champion-alias
              - champion
              - --optuna-trials
              - "50"
              - --random-seed
              - "42"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - --editable ${workspace.file_path}
              - xgboost>=2.0,<3.0
              - scikit-learn>=1.5,<2.0
              - shap>=0.44,<1.0
              - optuna>=3.6,<4.0
              - mlflow>=3.0,<4.0
