services:
  etl_pipeline:
    type: pipeline
    manifest: services/etl/service.yml
  etl_file_arrival:
    type: job
    manifest: services/etl/file_arrival.service.yml
    depends_on:
      - etl_pipeline
  etl_fast_dev:
    type: job
    manifest: services/etl/fast_dev.service.yml
    depends_on:
      - etl_pipeline
  analytics_observability:
    type: job
    manifest: services/etl/analytics_observability.service.yml
    depends_on:
      - etl_pipeline
  rag_vector_index:
    type: job
    manifest: services/rag/vector_index/service.yml
    depends_on:
      - etl_pipeline
  ml_training:
    type: job
    manifest: services/ml/training/service.yml
    depends_on:
      - etl_pipeline
  setup_infrastructure:
    type: job
    manifest: services/infrastructure/setup/service.yml
  frontend_app:
    type: app
    manifest: services/frontend/service.yml
    depends_on:
      - etl_pipeline
      - ml_training
      - rag_vector_index
