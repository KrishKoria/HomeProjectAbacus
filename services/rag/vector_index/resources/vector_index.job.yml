resources:
  jobs:
    rag_vector_index_job:
      name: "[${bundle.target}] RAG Vector Index Sync"
      tasks:
        - task_key: create_or_sync_policy_vector_index
          spark_python_task:
            python_file: ../../../../src/scripts/create_vector_index.py
            parameters:
              - --mv-source-table
              - ${var.catalog}.${var.gold_schema}.policy_chunks
              - --source-table
              - ${var.catalog}.${var.gold_schema}.policy_chunks_vs
              - --endpoint-name
              - ${var.vector_search_endpoint_name}
              - --index-name
              - ${var.vector_search_index_name}
              - --query-model-endpoint
              - ${var.vector_search_query_model_endpoint_name}
              - --embedding-column
              - embedding_vector
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - --editable ${workspace.file_path}
              - databricks-vectorsearch>=0.67,<1.0
