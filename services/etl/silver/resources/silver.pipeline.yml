resources:
  pipelines:
    silver_pipeline:
      name: "[${bundle.target}] Healthcare Silver Validation"
      catalog: ${var.catalog}
      target: ${var.silver_schema}
      serverless: true
      channel: current
      libraries:
        - glob:
            include: ../../../../ETL/pipelines/silver/**
      environment:
        dependencies:
          - --editable ${workspace.file_path}
      event_log:
        catalog: ${var.catalog}
        schema: ${var.analytics_schema}
        name: silver_pipeline_event_log
