resources:
  pipelines:
    gold_pipeline:
      name: "[${bundle.target}] Healthcare Gold Features"
      catalog: ${var.catalog}
      target: ${var.gold_schema}
      photon: false
      channel: current
      configuration:
        pipelines.clusterShutdown.delay: "300s"
      libraries:
        - glob:
            include: ../../../../ETL/pipelines/gold/**
      event_log:
        catalog: ${var.catalog}
        schema: ${var.analytics_schema}
        name: gold_pipeline_event_log
      clusters:
        - label: default
          node_type_id: ${var.node_type_id}
          driver_node_type_id: ${var.node_type_id}
          num_workers: 0
          gcp_attributes:
            availability: ON_DEMAND_GCP
            local_ssd_count: 1
            zone_id: AUTO
          spark_conf:
            spark.databricks.cluster.profile: singleNode
            spark.master: local[*]
          custom_tags:
            ResourceClass: SingleNode
            Project: homeprojectabacus
            Environment: ${bundle.target}
