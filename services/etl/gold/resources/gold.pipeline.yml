resources:
  pipelines:
    gold_pipeline:
      name: "[${bundle.target}] Healthcare Gold Features"
      catalog: ${var.catalog}
      target: ${var.gold_schema}
      photon: true
      channel: current
      libraries:
        - glob:
            include: ../../../../ETL/pipelines/gold/**
      event_log:
        catalog: ${var.catalog}
        schema: ${var.analytics_schema}
        name: gold_pipeline_event_log
      clusters:
        - label: default
          gcp_attributes:
            availability: PREEMPTIBLE_WITH_FALLBACK_GCP
          autoscale:
            min_workers: 1
            max_workers: 4
            mode: ENHANCED
