resources:
  pipelines:
    bronze_pipeline:
      name: "[${bundle.target}] Healthcare Bronze Ingestion"
      catalog: ${var.catalog}
      target: ${var.bronze_schema}
      photon: true
      channel: current
      libraries:
        - glob:
            include: ../../../../ETL/pipelines/bronze/**
      event_log:
        catalog: ${var.catalog}
        schema: ${var.analytics_schema}
        name: bronze_pipeline_event_log
      clusters:
        - label: default
          gcp_attributes:
            availability: PREEMPTIBLE_WITH_FALLBACK_GCP
          autoscale:
            min_workers: 1
            max_workers: 4
            mode: ENHANCED
