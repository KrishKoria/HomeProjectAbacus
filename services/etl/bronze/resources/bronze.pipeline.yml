resources:
  pipelines:
    bronze_pipeline:
      name: "[${bundle.target}] Healthcare Bronze Ingestion"
      catalog: ${var.catalog}
      target: ${var.bronze_schema}
      serverless: true
      channel: current
      libraries:
        - glob:
            include: ../../../../ETL/pipelines/bronze/**
        - glob:
            include: ../../../../ETL/common/**
        - glob:
            include: ../../../../src/common/**
      event_log:
        catalog: ${var.catalog}
        schema: ${var.analytics_schema}
        name: bronze_pipeline_event_log
