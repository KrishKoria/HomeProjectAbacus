substitutions:
  _REGION: asia-south1
  _SERVICE: homeprojectabacus-frontend
  _AR_REPOSITORY: homeprojectabacus
  _IMAGE_NAME: homeprojectabacus-frontend
  _RUNTIME_SERVICE_ACCOUNT: homeprojectabacus-cloud-run@monthhome.iam.gserviceaccount.com
  _BETTER_AUTH_URL: https://homeprojectabacus-frontend-88897055243.asia-south1.run.app
  _DATABRICKS_HOST: https://8259552159587810.0.gcp.databricks.com/
  _DATABRICKS_SQL_WAREHOUSE_ID: 26e842cddb906c23
  _DATABRICKS_SQL_HTTP_PATH: /sql/1.0/warehouses/26e842cddb906c23
  _CLAIMOPS_FEATURE_TABLE: healthcare.gold.claim_features
  _CLAIMOPS_ANALYSIS_ENDPOINT: claim-denial-analysis
  _CLAIMOPS_CHAT_MODEL: databricks-meta-llama-3-3-70b-instruct
  _CLAIMOPS_APP_ORIGIN: https://homeprojectabacus-frontend-88897055243.asia-south1.run.app
  _CLAIMOPS_GCS_LANDING_BUCKET: homeprojectabacus-etl-landing-monthhome
  _CLAIMOPS_GCS_LANDING_PREFIX: claimops-raw-landing
  _CLAIMOPS_UPLOAD_CSV_MAX_BYTES: "100000000"
  _CLAIMOPS_UPLOAD_PDF_MAX_BYTES: "50000000"
  _CLAIMOPS_UPLOAD_SIGNED_POLICY_TTL_SECONDS: "900"
  _BETTER_AUTH_SECRET_SECRET: better-auth-secret
  _GOOGLE_CLIENT_ID_SECRET: google-client-id
  _GOOGLE_CLIENT_SECRET_SECRET: google-client-secret
  _DATABASE_URL_SECRET: neon-database-url
  _DATABASE_DIRECT_URL_SECRET: neon-database-direct-url
  _DATABRICKS_CLIENT_ID_SECRET: databricks-client-id
  _DATABRICKS_CLIENT_SECRET_SECRET: databricks-client-secret
  _CLAIMOPS_ALLOWED_EMAIL_DOMAINS_SECRET: claimops-allowed-email-domains
  _CLAIMOPS_BOOTSTRAP_ADMIN_EMAILS_SECRET: claimops-bootstrap-admin-emails
  _RUN_DB_MIGRATIONS: "false"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

steps:
  - id: run-db-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -Eeuo pipefail
        if [ "${_RUN_DB_MIGRATIONS}" != "true" ]; then
          echo "Skipping database migrations"
          exit 0
        fi

        gcloud builds submit . \
          --config=cloudbuild.migrations.yaml \
          --project=${PROJECT_ID} \
          --region=${_REGION} \
          --substitutions=_DATABASE_DIRECT_URL_SECRET=${_DATABASE_DIRECT_URL_SECRET}
    waitFor:
      - "-"

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
      - frontend
    waitFor:
      - "-"

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
    waitFor:
      - build-image

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --allow-unauthenticated
      - --ingress=all
      - --port=8080
      - --min-instances=0
      - --max-instances=6
      - --concurrency=40
      - --cpu=1
      - --memory=1Gi
      - --clear-cloudsql-instances
      - --set-env-vars=BETTER_AUTH_URL=${_BETTER_AUTH_URL},DATABRICKS_HOST=${_DATABRICKS_HOST},DATABRICKS_SQL_WAREHOUSE_ID=${_DATABRICKS_SQL_WAREHOUSE_ID},DATABRICKS_SQL_HTTP_PATH=${_DATABRICKS_SQL_HTTP_PATH},CLAIMOPS_FEATURE_TABLE=${_CLAIMOPS_FEATURE_TABLE},CLAIMOPS_ANALYSIS_ENDPOINT=${_CLAIMOPS_ANALYSIS_ENDPOINT},CLAIMOPS_CHAT_MODEL=${_CLAIMOPS_CHAT_MODEL},CLAIMOPS_APP_ORIGIN=${_CLAIMOPS_APP_ORIGIN},CLAIMOPS_GCS_LANDING_BUCKET=${_CLAIMOPS_GCS_LANDING_BUCKET},CLAIMOPS_GCS_LANDING_PREFIX=${_CLAIMOPS_GCS_LANDING_PREFIX},CLAIMOPS_UPLOAD_CSV_MAX_BYTES=${_CLAIMOPS_UPLOAD_CSV_MAX_BYTES},CLAIMOPS_UPLOAD_PDF_MAX_BYTES=${_CLAIMOPS_UPLOAD_PDF_MAX_BYTES},CLAIMOPS_UPLOAD_SIGNED_POLICY_TTL_SECONDS=${_CLAIMOPS_UPLOAD_SIGNED_POLICY_TTL_SECONDS},BETTER_AUTH_TRUSTED_ORIGINS=${_CLAIMOPS_APP_ORIGIN}
      - --set-secrets=BETTER_AUTH_SECRET=${_BETTER_AUTH_SECRET_SECRET}:latest,GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID_SECRET}:latest,GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET_SECRET}:latest,DATABASE_URL=${_DATABASE_URL_SECRET}:latest,DATABRICKS_CLIENT_ID=${_DATABRICKS_CLIENT_ID_SECRET}:latest,DATABRICKS_CLIENT_SECRET=${_DATABRICKS_CLIENT_SECRET_SECRET}:latest,CLAIMOPS_ALLOWED_EMAIL_DOMAINS=${_CLAIMOPS_ALLOWED_EMAIL_DOMAINS_SECRET}:latest,CLAIMOPS_BOOTSTRAP_ADMIN_EMAILS=${_CLAIMOPS_BOOTSTRAP_ADMIN_EMAILS_SECRET}:latest
    waitFor:
      - push-image
      - run-db-migrations

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}
