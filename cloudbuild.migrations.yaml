substitutions:
  _CLOUD_SQL_CONNECTION_NAME: monthhome:asia-south1:homeprojectabacus
  _DB_NAME: homeprojectabacus
  _DB_USER: postgres
  _DB_PORT: "5432"
  _PROXY_HTTP_PORT: "9090"
  _DB_PASSWORD_SECRET: db-password
  _CLOUD_SQL_PROXY_VERSION: v2.21.3

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  automapSubstitutions: true

timeout: 1200s

steps:
  - id: run-migrations
    name: oven/bun:1.3.12
    dir: frontend
    script: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      apt-get update -qq
      apt-get install -y -qq ca-certificates curl
      update-ca-certificates

      proxy_url="https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${_CLOUD_SQL_PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
      curl -fsSL "${proxy_url}" -o /tmp/cloud-sql-proxy
      chmod +x /tmp/cloud-sql-proxy

      /tmp/cloud-sql-proxy "${_CLOUD_SQL_CONNECTION_NAME}" \
        --port "${_DB_PORT}" \
        --health-check \
        --http-port "${_PROXY_HTTP_PORT}" &
      proxy_pid=$!
      trap 'kill "${proxy_pid}" 2>/dev/null || true' EXIT

      /tmp/cloud-sql-proxy wait \
        --http-port "${_PROXY_HTTP_PORT}" \
        --max 30s

      bun install --frozen-lockfile
      DB_HOST=127.0.0.1 \
      DB_NAME="${_DB_NAME}" \
      DB_PASSWORD="${DB_PASSWORD}" \
      DB_PORT="${_DB_PORT}" \
      DB_USER="${_DB_USER}" \
      bunx drizzle-kit migrate
    secretEnv:
      - DB_PASSWORD

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_DB_PASSWORD_SECRET}/versions/latest
      env: DB_PASSWORD
