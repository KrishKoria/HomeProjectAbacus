substitutions:
  _DATABASE_DIRECT_URL_SECRET: neon-database-direct-url

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
  automapSubstitutions: true

timeout: 600s

steps:
  - id: run-migrations
    name: oven/bun:1.3.12
    dir: frontend
    script: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      bun install --frozen-lockfile
      bun scripts/baseline-drizzle-migrations.ts
      bunx drizzle-kit migrate --config=drizzle.config.ts
    secretEnv:
      - DATABASE_URL

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/${_DATABASE_DIRECT_URL_SECRET}/versions/latest
      env: DATABASE_URL
